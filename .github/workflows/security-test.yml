name: Security Tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install bandit pip-audit
          pip install -r 3_requirements.txt

      - name: Run Bandit
        run: |
          bandit -r . -ll
        continue-on-error: true

      - name: Run Pip-audit
        run: |
          pip-audit -r 3_requirements.txt
        continue-on-error: true

      - name: Security Summary
        run: |
          echo "========================================="
          echo "Security Tests Completed"
          echo "========================================="