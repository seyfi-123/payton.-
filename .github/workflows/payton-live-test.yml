name: Payton Live Test

on:
  workflow_dispatch:

jobs:
  payton-e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PAYTON_BASE_URL: https://payton-production.up.railway.app
      PAYTON_API_KEY: ${{ secrets.API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

      # MUHIM:
      # Бу ерга Payton қабул қиладиган valid SELF IBAN қўйилади.
      # TEST_SELF_IBAN_001 каби placeholder қўйманг.
      PAYTON_SELF_IBAN: ${{ secrets.SELF_IBAN }}

      PAYTON_GUARANTOR_PHONE: ${{ secrets.GUARANTOR_PHONE }}
      PAYTON_UNIVERSITY_IBAN: ${{ secrets.UNIVERSITY_IBAN }}
      PAYTON_LANDLORD_IBAN: ${{ secrets.LANDLORD_IBAN }}

      MOCKJET_BASE_URL: https://mockjet.io/m/5b1fe03c-9ffd-43e6-848c-7fd3a1b711a9
      MOCKJET_CIB_KEY: ${{ secrets.MOCKJET_CIB_KEY }}
      MOCKJET_ABS_KEY: ${{ secrets.MOCKJET_ABS_KEY }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check required secrets
        shell: bash
        run: |
          set -e

          if [ -z "$PAYTON_API_KEY" ]; then
            echo "::error::API_KEY secret is missing"
            exit 1
          fi

          if [ -z "$PAYTON_SIGNING_SECRET" ]; then
            echo "::error::SIGNING_SECRET secret is missing"
            exit 1
          fi

          if [ -z "$PAYTON_SELF_IBAN" ]; then
            echo "::error::SELF_IBAN secret is missing"
            exit 1
          fi

          echo "API_KEY length: ${#PAYTON_API_KEY}"
          echo "SIGNING_SECRET length: ${#PAYTON_SIGNING_SECRET}"
          echo "SELF_IBAN configured: YES"

      - name: Run Payton + MockJet E2E
        shell: bash
        run: |

          cat > live_test.py <<'PY'

          import hashlib
          import hmac
          import json
          import os
          import sys
          import time
          import uuid
          import requests


          # ============================================================
          # CONFIG
          # ============================================================

          BASE_URL = os.environ["PAYTON_BASE_URL"].rstrip("/")
          ENDPOINT = BASE_URL + "/api/v1/credit/apply"

          API_KEY = os.environ["PAYTON_API_KEY"]
          SIGNING_SECRET = os.environ["PAYTON_SIGNING_SECRET"]

          # REAL VALID TEST SELF IBAN FROM GITHUB SECRET
          SELF_IBAN = os.environ["PAYTON_SELF_IBAN"].strip()

          UNIVERSITY_IBAN = os.environ.get(
              "PAYTON_UNIVERSITY_IBAN", ""
          ).strip()

          LANDLORD_IBAN = os.environ.get(
              "PAYTON_LANDLORD_IBAN", ""
          ).strip()

          GUARANTOR_PHONE = os.environ.get(
              "PAYTON_GUARANTOR_PHONE", ""
          ).strip()

          MOCKJET_BASE_URL = os.environ[
              "MOCKJET_BASE_URL"
          ].rstrip("/")

          MOCKJET_CIB_KEY = os.environ.get(
              "MOCKJET_CIB_KEY", ""
          ).strip()

          MOCKJET_ABS_KEY = os.environ.get(
              "MOCKJET_ABS_KEY", ""
          ).strip()


          session = requests.Session()

          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })


          passed = 0
          failed = 0


          # ============================================================
          # HELPERS
          # ============================================================

          def pretty(data):
              try:
                  return json.dumps(
                      data,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )
              except Exception:
                  return str(data)


          def make_request_id(product):
              return (
                  f"LIVE_{product}_"
                  f"{uuid.uuid4().hex[:12]}"
              )


          def make_phone(number):
              # +992 + 9 digits
              return f"+992900{number:06d}"


          def valid_face(number):
              return f"TEST_FACE_ID_{number:03d}_LIVE"


          def valid_dob():
              return "2000-01-15"


          def invalid_dob():
              return "not-a-date"


          def invalid_iban():
              return "BAD_IBAN"


          # ============================================================
          # SIGNATURE
          # ============================================================

          def make_signature(body):
              timestamp = str(int(time.time()))

              body_hash = hashlib.sha256(
                  body.encode("utf-8")
              ).hexdigest()

              canonical = (
                  "POST\n"
                  "/api/v1/credit/apply\n"
                  f"{timestamp}\n"
                  f"{body_hash}"
              )

              digest = hmac.new(
                  SIGNING_SECRET.encode("utf-8"),
                  canonical.encode("utf-8"),
                  hashlib.sha256
              ).hexdigest()

              return f"{timestamp}.{digest}"


          # ============================================================
          # PAYLOAD
          # ============================================================

          def payload(
              product,
              amount,
              number,
              self_iban=None,
              dob=None,
              face=None
          ):

              data = {
                  "request_id": make_request_id(product),
                  "product_type": product,
                  "amount": amount,

                  "user_phone": make_phone(number),

                  "passport_series": "AA",
                  "passport_number": f"{100000 + number:06d}",

                  "date_of_birth": (
                      valid_dob()
                      if dob is None
                      else dob
                  ),

                  "face_id_data": (
                      valid_face(number)
                      if face is None
                      else face
                  ),

                  # MUHIM:
                  # valid testlar REAL SELF_IBAN ishlatadi
                  "self_iban": (
                      SELF_IBAN
                      if self_iban is None
                      else self_iban
                  ),
              }

              if product == "StudentPay":
                  data["university_iban"] = UNIVERSITY_IBAN

              if product == "RentPay":
                  data["landlord_iban"] = LANDLORD_IBAN

              return data


          # ============================================================
          # PAYTON REQUEST
          # ============================================================

          def send_payton(
              data,
              missing_signature=False,
              bad_signature=False,
              bad_api_key=False
          ):

              body = json.dumps(
                  data,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",

                  "X-API-KEY": (
                      "WRONG_API_KEY"
                      if bad_api_key
                      else API_KEY
                  )
              }

              signature = make_signature(body)

              if bad_signature:
                  timestamp, digest = signature.split(".", 1)

                  first = (
                      "0"
                      if digest[0] != "0"
                      else "1"
                  )

                  signature = (
                      timestamp
                      + "."
                      + first
                      + digest[1:]
                  )

              if not missing_signature:
                  headers["X-Signature"] = signature

              response = session.post(
                  ENDPOINT,
                  data=body.encode("utf-8"),
                  headers=headers,
                  timeout=30
              )

              try:
                  result = response.json()
              except Exception:
                  result = response.text

              return response.status_code, result


          # ============================================================
          # VALIDATION CHECKS
          # ============================================================

          def has_code(data, code):

              if not isinstance(data, dict):
                  return False

              detail = data.get("detail")

              if isinstance(detail, dict):
                  return detail.get("code") == code

              if isinstance(detail, list):
                  return any(
                      isinstance(item, dict)
                      and item.get("code") == code
                      for item in detail
                  )

              return data.get("code") == code


          def is_validation_error(data):

              if not isinstance(data, dict):
                  return False

              detail = data.get("detail")

              if not isinstance(detail, list):
                  return False

              return any(
                  isinstance(item, dict)
                  and "type" in item
                  for item in detail
              )


          # ============================================================
          # RUN PAYTON TEST
          # ============================================================

          def test_payton(
              label,
              description,
              data,
              expected
          ):

              global passed, failed

              print()
              print("=" * 72)
              print(f"{label} | {description}")
              print("=" * 72)

              print(
                  f"Product: {data.get('product_type')}"
              )

              print(
                  f"Amount: {data.get('amount')}"
              )

              print(
                  f"Request: {data.get('request_id')}"
              )

              try:

                  status, result = send_payton(
                      data,
                      missing_signature=(
                          expected == "AUTH_MISSING"
                      ),
                      bad_signature=(
                          expected == "AUTH_BAD_SIGNATURE"
                      ),
                      bad_api_key=(
                          expected == "AUTH_BAD_KEY"
                      )
                  )

              except Exception as error:

                  print(f"ERROR: {error}")

                  failed += 1

                  print(f"❌ {label} FAIL")

                  return False


              print(f"HTTP: {status}")
              print(f"DATA: {pretty(result)}")


              ok = False


              # --------------------------------------------------------
              # SUCCESS
              # --------------------------------------------------------

              if expected == "SUCCESS":

                  ok = (
                      status == 200
                      and isinstance(result, dict)
                  )


              # --------------------------------------------------------
              # INVALID SELF IBAN
              # --------------------------------------------------------

              elif expected == "INVALID_IBAN":

                  ok = (
                      status == 400
                      and has_code(
                          result,
                          "E1006"
                      )
                  )


              # --------------------------------------------------------
              # VALIDATION
              # --------------------------------------------------------

              elif expected == "VALIDATION":

                  ok = (
                      status == 422
                      and is_validation_error(result)
                  )


              # --------------------------------------------------------
              # AUTH
              # --------------------------------------------------------

              elif expected in (
                  "AUTH_MISSING",
                  "AUTH_BAD_SIGNATURE",
                  "AUTH_BAD_KEY"
              ):

                  ok = status in (401, 403)


              if ok:

                  passed += 1

                  print(f"✅ {label} PASS")

              else:

                  failed += 1

                  print(
                      f"❌ {label} FAIL "
                      f"(expected={expected})"
                  )

              return ok


          # ============================================================
          # MOCKJET
          # ============================================================

          def mockjet_test(
              label,
              path,
              key,
              body
          ):

              global passed, failed

              print()
              print("=" * 72)
              print(
                  f"{label} | MockJet POST {path}"
              )
              print("=" * 72)

              if not key:

                  print(
                      "MockJet key is not configured"
                  )

                  failed += 1

                  print(f"❌ {label} FAIL")

                  return False


              try:

                  response = session.post(
                      MOCKJET_BASE_URL + path,
                      json=body,
                      headers={
                          "Authorization":
                              f"Bearer {key}"
                      },
                      timeout=30
                  )

                  try:
                      result = response.json()
                  except Exception:
                      result = response.text

              except Exception as error:

                  print(f"ERROR: {error}")

                  failed += 1

                  print(f"❌ {label} FAIL")

                  return False


              print(f"HTTP: {response.status_code}")
              print(f"DATA: {pretty(result)}")


              if response.status_code == 200:

                  passed += 1

                  print(f"✅ {label} PASS")

                  return True


              failed += 1

              print(f"❌ {label} FAIL")

              return False


          # ============================================================
          # MOCKJET 4 TESTS
          # ============================================================

          def run_mockjet():

              print()
              print("#" * 72)
              print("MOCKJET E2E")
              print("#" * 72)


              mockjet_test(
                  "M01",
                  "/api/check",
                  MOCKJET_CIB_KEY,
                  {
                      "passport": "AA100001"
                  }
              )


              mockjet_test(
                  "M02",
                  "/api/score",
                  MOCKJET_CIB_KEY,
                  {
                      "passport": "AA100001"
                  }
              )


              mockjet_test(
                  "M03",
                  "/api/contracts",
                  MOCKJET_ABS_KEY,
                  {
                      "passport": "AA100001",
                      "amount": 1000,
                      "product": "DAILY_PAY"
                  }
              )


              mockjet_test(
                  "M04",
                  "/api/contracts",
                  MOCKJET_ABS_KEY,
                  {
                      "passport": "AA100002",
                      "amount": 2000,
                      "product": "DAILY_PAY"
                  }
              )


          # ============================================================
          # STUDENTPAY - 20 TESTS
          # ============================================================

          def run_studentpay():

              amounts = [
                  1000, 1500, 2000, 2500, 3000,
                  3500, 4000, 4500, 5000, 5500,
                  6000, 6500, 7000, 7500, 8000
              ]

              for index, amount in enumerate(
                  amounts,
                  start=1
              ):

                  test_payton(
                      f"S{index:02d}",
                      f"StudentPay valid {amount}",
                      payload(
                          "StudentPay",
                          amount,
                          100 + index
                      ),
                      "SUCCESS"
                  )


              p = payload(
                  "StudentPay",
                  1000,
                  116
              )

              p["product_type"] = "STUDENT_PAY"

              test_payton(
                  "S16",
                  "StudentPay invalid product",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "StudentPay",
                  1000,
                  117
              )

              del p["user_phone"]

              test_payton(
                  "S17",
                  "StudentPay missing user_phone",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "StudentPay",
                  1000,
                  118
              )

              p["user_phone"] = ""

              test_payton(
                  "S18",
                  "StudentPay empty user_phone",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "StudentPay",
                  1000,
                  119,
                  face="TEST"
              )

              test_payton(
                  "S19",
                  "StudentPay short face_id_data",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "StudentPay",
                  1000,
                  120,
                  self_iban=invalid_iban()
              )

              test_payton(
                  "S20",
                  "StudentPay invalid self IBAN",
                  p,
                  "INVALID_IBAN"
              )


          # ============================================================
          # RENTPAY - 20 TESTS
          # ============================================================

          def run_rentpay():

              amounts = [
                  1000, 1500, 2000, 2500, 3000,
                  3500, 4000, 4500, 5000, 5500,
                  6000, 6500, 7000, 7500, 8000
              ]

              for index, amount in enumerate(
                  amounts,
                  start=1
              ):

                  test_payton(
                      f"R{index:02d}",
                      f"RentPay valid {amount}",
                      payload(
                          "RentPay",
                          amount,
                          200 + index
                      ),
                      "SUCCESS"
                  )


              p = payload(
                  "RentPay",
                  1000,
                  216
              )

              p["product_type"] = "RENT_PAY"

              test_payton(
                  "R16",
                  "RentPay invalid product",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "RentPay",
                  1000,
                  217
              )

              del p["landlord_iban"]

              test_payton(
                  "R17",
                  "RentPay missing landlord_iban",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "RentPay",
                  1000,
                  218
              )

              p["landlord_iban"] = ""

              test_payton(
                  "R18",
                  "RentPay empty landlord_iban",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "RentPay",
                  1000,
                  219,
                  dob=invalid_dob()
              )

              test_payton(
                  "R19",
                  "RentPay invalid DOB",
                  p,
                  "VALIDATION"
              )


              p = payload(
                  "RentPay",
                  1000,
                  220,
                  self_iban=invalid_iban()
              )

              test_payton(
                  "R20",
                  "RentPay invalid self IBAN",
                  p,
                  "INVALID_IBAN"
              )


          # ============================================================
          # DAILY PAY - 30 TESTS
          # ============================================================

          def run_dailypay():

              amounts = [
                  100, 200, 300, 400, 500,
                  600, 700, 800, 900, 1000,
                  1200, 1500, 2000, 2500, 3000,
                  3500, 4000, 4500, 5000, 6000
              ]

              # D01-D20 VALID
              for index, amount in enumerate(
                  amounts,
                  start=1
              ):

                  test_payton(
                      f"D{index:02d}",
                      f"DailyPay valid {amount}",
                      payload(
                          "DailyPay",
                          amount,
                          300 + index
                      ),
                      "SUCCESS"
                  )


              # D21 INVALID DOB

              p = payload(
                  "DailyPay",
                  1000,
                  321,
                  dob=invalid_dob()
              )

              test_payton(
                  "D21",
                  "DailyPay invalid DOB",
                  p,
                  "VALIDATION"
              )


              # D22 SHORT FACE

              p = payload(
                  "DailyPay",
                  1000,
                  322,
                  face="TEST"
              )

              test_payton(
                  "D22",
                  "DailyPay short face_id_data",
                  p,
                  "VALIDATION"
              )


              # D23 INVALID IBAN
              # Бу ерда атайлаб INVALID IBAN берилади.
              # Шунинг учун E1006 кутилади.

              p = payload(
                  "DailyPay",
                  300,
                  323,
                  self_iban=invalid_iban()
              )

              test_payton(
                  "D23",
                  "DailyPay invalid self IBAN 300",
                  p,
                  "INVALID_IBAN"
              )


              # D24 INVALID IBAN

              p = payload(
                  "DailyPay",
                  400,
                  324,
                  self_iban=invalid_iban()
              )

              test_payton(
                  "D24",
                  "DailyPay invalid self IBAN 400",
                  p,
                  "INVALID_IBAN"
              )


              # D25 INVALID IBAN

              p = payload(
                  "DailyPay",
                  500,
                  325,
                  self_iban=invalid_iban()
              )

              test_payton(
                  "D25",
                  "DailyPay invalid self IBAN 500",
                  p,
                  "INVALID_IBAN"
              )


              # D26 INVALID DOB

              p = payload(
                  "DailyPay",
                  1000,
                  326,
                  dob=invalid_dob()
              )

              test_payton(
                  "D26",
                  "DailyPay invalid DOB second",
                  p,
                  "VALIDATION"
              )


              # D27 SHORT PHONE

              p = payload(
                  "DailyPay",
                  1000,
                  327
              )

              p["user_phone"] = "123"

              test_payton(
                  "D27",
                  "DailyPay short user_phone",
                  p,
                  "VALIDATION"
              )


              # D28 INVALID AMOUNT

              p = payload(
                  "DailyPay",
                  1000,
                  328
              )

              p["amount"] = 0

              test_payton(
                  "D28",
                  "DailyPay invalid amount",
                  p,
                  "VALIDATION"
              )


              # D29 EMPTY PHONE

              p = payload(
                  "DailyPay",
                  1000,
                  329
              )

              p["user_phone"] = ""

              test_payton(
                  "D29",
                  "DailyPay empty user_phone",
                  p,
                  "VALIDATION"
              )


              # D30 OLD PHONE FIELD

              p = payload(
                  "DailyPay",
                  1000,
                  330
              )

              p["phone"] = "+992900000001"

              test_payton(
                  "D30",
                  "DailyPay extra old phone field",
                  p,
                  "VALIDATION"
              )


          # ============================================================
          # AUTH TESTS
          # ============================================================

          def run_auth_tests():

              print()
              print("#" * 72)
              print("AUTHENTICATION TESTS")
              print("#" * 72)


              p = payload(
                  "DailyPay",
                  1000,
                  901
              )

              test_payton(
                  "AUTH01",
                  "Missing X-Signature",
                  p,
                  "AUTH_MISSING"
              )


              p = payload(
                  "DailyPay",
                  1000,
                  902
              )

              test_payton(
                  "AUTH02",
                  "Tampered X-Signature",
                  p,
                  "AUTH_BAD_SIGNATURE"
              )


              p = payload(
                  "DailyPay",
                  1000,
                  903
              )

              test_payton(
                  "AUTH03",
                  "Wrong X-API-KEY",
                  p,
                  "AUTH_BAD_KEY"
              )


          # ============================================================
          # MAIN
          # ============================================================

          def main():

              global passed, failed

              print()
              print("=" * 72)
              print("PAYTON + MOCKJET E2E TEST")
              print("=" * 72)

              print(
                  f"Payton endpoint: {ENDPOINT}"
              )

              print(
                  "Primary tests: "
                  "4 MockJet + 70 Payton = 74"
              )

              print(
                  "Payton: "
                  "S01-S20 / R01-R20 / D01-D30"
              )

              print(
                  "Valid tests use SELF_IBAN "
                  "from GitHub Secret."
              )

              print(
                  "Invalid IBAN tests intentionally "
                  "use BAD_IBAN."
              )

              print("=" * 72)


              # --------------------------------------------------------
              # 4 MOCKJET
              # --------------------------------------------------------

              run_mockjet()


              # --------------------------------------------------------
              # 70 PAYTON
              # --------------------------------------------------------

              run_studentpay()

              run_rentpay()

              run_dailypay()


              # --------------------------------------------------------
              # PRIMARY RESULT
              # --------------------------------------------------------

              primary_pass = passed
              primary_fail = failed

              print()
              print("=" * 72)
              print("PRIMARY FINAL RESULT")
              print("=" * 72)

              print(
                  f"TOTAL : 74"
              )

              print(
                  f"PASS  : {primary_pass}"
              )

              print(
                  f"FAIL  : {primary_fail}"
              )

              print("=" * 72)


              # --------------------------------------------------------
              # AUTH TESTS
              # --------------------------------------------------------

              auth_before = passed + failed

              run_auth_tests()

              auth_total = (
                  passed
                  + failed
                  - auth_before
              )


              # --------------------------------------------------------
              # FINAL
              # --------------------------------------------------------

              print()
              print("=" * 72)
              print("FINAL RESULT")
              print("=" * 72)

              print(
                  f"PRIMARY TOTAL : 74"
              )

              print(
                  f"PRIMARY PASS  : {primary_pass}"
              )

              print(
                  f"PRIMARY FAIL  : {primary_fail}"
              )

              print(
                  f"AUTH TESTS    : {auth_total}"
              )

              print("=" * 72)


              if primary_fail > 0:

                  print(
                      f"❌ {primary_fail} "
                      f"PRIMARY TEST(S) FAILED"
                  )

                  sys.exit(1)


              print(
                  "✅ ALL 74 PRIMARY TESTS PASSED"
              )

              sys.exit(0)


          if __name__ == "__main__":
              main()

          PY

          python live_test.py