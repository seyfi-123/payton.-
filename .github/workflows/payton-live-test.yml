name: Payton Production Live Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PAYTON_BASE_URL: ${{ secrets.PAYTON_BASE_URL }}
      PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}
      PAYTON_ENDPOINT: /api/v1/credit/apply

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f 3_requirements.txt ]; then
            pip install -r 3_requirements.txt || true
          fi
          pip install httpx

      - name: Check required secrets
        run: |
          set -e

          if [ -z "$PAYTON_BASE_URL" ]; then
            echo "❌ PAYTON_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$PAYTON_API_KEY" ]; then
            echo "❌ PAYTON_API_KEY is missing"
            exit 1
          fi

          if [ -z "$PAYTON_SIGNING_SECRET" ]; then
            echo "❌ PAYTON_SIGNING_SECRET is missing"
            exit 1
          fi

          echo "✅ Required secrets are present"
          echo "BASE URL: $PAYTON_BASE_URL"
          echo "ENDPOINT: $PAYTON_ENDPOINT"

      - name: Run Payton live API test
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          cat > /tmp/payton_live_test.py <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import time
          import uuid

          import httpx


          BASE_URL = os.environ["PAYTON_BASE_URL"].rstrip("/")
          API_KEY = os.environ["PAYTON_API_KEY"]
          SIGNING_SECRET = os.environ["PAYTON_SIGNING_SECRET"]
          ENDPOINT = os.environ.get(
              "PAYTON_ENDPOINT",
              "/api/v1/credit/apply"
          )


          def make_signature(body: str, timestamp: str) -> str:
              body_hash = hashlib.sha256(
                  body.encode("utf-8")
              ).hexdigest()

              canonical = (
                  f"POST\n"
                  f"{ENDPOINT}\n"
                  f"{timestamp}\n"
                  f"{body_hash}"
              )

              digest = hmac.new(
                  SIGNING_SECRET.encode("utf-8"),
                  canonical.encode("utf-8"),
                  hashlib.sha256,
              ).hexdigest()

              return f"{timestamp}.{digest}"


          def request(payload, api_key=API_KEY, secret=SIGNING_SECRET):
              body = json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )

              timestamp = str(int(time.time()))

              body_hash = hashlib.sha256(
                  body.encode("utf-8")
              ).hexdigest()

              canonical = (
                  f"POST\n"
                  f"{ENDPOINT}\n"
                  f"{timestamp}\n"
                  f"{body_hash}"
              )

              signature = hmac.new(
                  secret.encode("utf-8"),
                  canonical.encode("utf-8"),
                  hashlib.sha256,
              ).hexdigest()

              headers = {
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "X-API-KEY": api_key,
                  "X-Signature": f"{timestamp}.{signature}",
              }

              url = BASE_URL + ENDPOINT

              try:
                  response = httpx.post(
                      url,
                      content=body.encode("utf-8"),
                      headers=headers,
                      timeout=30.0,
                  )

                  try:
                      response_json = response.json()
                  except Exception:
                      response_json = response.text

                  return response.status_code, response_json

              except Exception as exc:
                  return None, str(exc)


          def show(name, status, data, expected):
              print()
              print("=" * 70)
              print(name)
              print("=" * 70)
              print("HTTP:", status)
              print("EXPECTED:", expected)
              print("RESPONSE:")

              try:
                  print(json.dumps(
                      data,
                      ensure_ascii=False,
                      indent=2,
                  ))
              except Exception:
                  print(data)

              if status is None:
                  return False

              if isinstance(expected, range):
                  ok = status in expected
              elif isinstance(expected, set):
                  ok = status in expected
              else:
                  ok = status == expected

              print("RESULT:", "PASS" if ok else "FAIL")
              return ok


          def base_payload(
              product="DailyPay",
              amount=1000,
              phone=None,
              request_id=None,
          ):
              phone = phone or (
                  "+992900"
                  + str(uuid.uuid4().int)[-7:]
              )

              return {
                  "request_id": request_id or (
                      "GH_" + uuid.uuid4().hex[:20]
                  ),
                  "product_type": product,
                  "amount": amount,
                  "user_phone": phone,
                  "passport_series": "AA",
                  "passport_number": (
                      str(uuid.uuid4().int)[-8:]
                  ),
                  "date_of_birth": "1998-01-15",
                  "face_id_data": "TEST_FACE_ID_001",
              }


          results = []

          print()
          print("PAYTON LIVE TEST")
          print("BASE URL:", BASE_URL)
          print("ENDPOINT:", ENDPOINT)
          print()

          # ------------------------------------------------------------
          # TEST 01 — Valid DailyPay
          # ------------------------------------------------------------

          p01 = base_payload(
              product="DailyPay",
              amount=1000,
          )

          status, data = request(p01)

          results.append(
              show(
                  "TEST 01 — VALID DAILY PAY",
                  status,
                  data,
                  range(200, 300),
              )
          )


          # ------------------------------------------------------------
          # TEST 02 — Valid StudentPay
          # ------------------------------------------------------------

          p02 = base_payload(
              product="StudentPay",
              amount=3000,
          )

          p02["university_iban"] = "TJ00000000000000000001"

          status, data = request(p02)

          results.append(
              show(
                  "TEST 02 — VALID STUDENT PAY",
                  status,
                  data,
                  range(200, 300),
              )
          )


          # ------------------------------------------------------------
          # TEST 03 — Valid RentPay
          # ------------------------------------------------------------

          p03 = base_payload(
              product="RentPay",
              amount=1000,
          )

          p03["landlord_iban"] = "TJ00000000000000000002"

          status, data = request(p03)

          results.append(
              show(
                  "TEST 03 — VALID RENT PAY",
                  status,
                  data,
                  range(200, 300),
              )
          )


          # ------------------------------------------------------------
          # TEST 04 — Invalid product
          # ------------------------------------------------------------

          p04 = base_payload()
          p04["product_type"] = "DAILY_PAY"

          status, data = request(p04)

          results.append(
              show(
                  "TEST 04 — INVALID PRODUCT",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 05 — Missing user_phone
          # ------------------------------------------------------------

          p05 = base_payload()
          del p05["user_phone"]

          status, data = request(p05)

          results.append(
              show(
                  "TEST 05 — MISSING USER PHONE",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 06 — Invalid face_id_data
          # ------------------------------------------------------------

          p06 = base_payload()
          p06["face_id_data"] = "TEST"

          status, data = request(p06)

          results.append(
              show(
                  "TEST 06 — INVALID FACE ID",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 07 — Invalid amount
          # ------------------------------------------------------------

          p07 = base_payload()
          p07["amount"] = -100

          status, data = request(p07)

          results.append(
              show(
                  "TEST 07 — NEGATIVE AMOUNT",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 08 — Zero amount
          # ------------------------------------------------------------

          p08 = base_payload()
          p08["amount"] = 0

          status, data = request(p08)

          results.append(
              show(
                  "TEST 08 — ZERO AMOUNT",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 09 — Invalid phone
          # ------------------------------------------------------------

          p09 = base_payload()
          p09["user_phone"] = "123"

          status, data = request(p09)

          results.append(
              show(
                  "TEST 09 — INVALID PHONE",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 10 — Extra unsupported field
          # ------------------------------------------------------------

          p10 = base_payload()
          p10["extra_data"] = "SHOULD_NOT_BE_ACCEPTED"

          status, data = request(p10)

          results.append(
              show(
                  "TEST 10 — EXTRA FIELD",
                  status,
                  data,
                  range(400, 500),
              )
          )


          # ------------------------------------------------------------
          # TEST 11 — Invalid API key
          # ------------------------------------------------------------

          p11 = base_payload()

          status, data = request(
              p11,
              api_key="INVALID_API_KEY",
          )

          results.append(
              show(
                  "TEST 11 — INVALID API KEY",
                  status,
                  data,
                  {401, 403},
              )
          )


          # ------------------------------------------------------------
          # TEST 12 — Invalid signature
          # ------------------------------------------------------------

          p12 = base_payload()

          status, data = request(
              p12,
              secret="INVALID_SIGNING_SECRET",
          )

          results.append(
              show(
                  "TEST 12 — INVALID SIGNATURE",
                  status,
                  data,
                  {401, 403},
              )
          )


          # ------------------------------------------------------------
          # TEST 13 — Duplicate request_id
          # ------------------------------------------------------------

          duplicate_id = (
              "GH_DUP_" + uuid.uuid4().hex[:20]
          )

          p13a = base_payload(
              request_id=duplicate_id
          )

          status1, data1 = request(p13a)

          print()
          print("=" * 70)
          print("TEST 13A — FIRST REQUEST")
          print("=" * 70)
          print("HTTP:", status1)
          print("RESPONSE:", json.dumps(
              data1,
              ensure_ascii=False,
              indent=2,
          ))

          p13b = dict(p13a)

          status2, data2 = request(p13b)

          print()
          print("=" * 70)
          print("TEST 13B — DUPLICATE REQUEST")
          print("=" * 70)
          print("HTTP:", status2)
          print("RESPONSE:", json.dumps(
              data2,
              ensure_ascii=False,
              indent=2,
          ))

          duplicate_ok = (
              status2 in range(400, 500)
              or status2 in range(200, 300)
          )

          print(
              "RESULT:",
              "PASS" if duplicate_ok else "FAIL"
          )

          results.append(duplicate_ok)


          # ------------------------------------------------------------
          # FINAL RESULT
          # ------------------------------------------------------------

          passed = sum(results)
          failed = len(results) - passed
          total = len(results)

          print()
          print()
          print("#" * 70)
          print("PAYTON LIVE TEST FINAL RESULT")
          print("#" * 70)
          print("TOTAL :", total)
          print("PASS  :", passed)
          print("FAIL  :", failed)
          print("#" * 70)

          if failed:
              print()
              print("❌ LIVE TEST FAILED")
              raise SystemExit(1)

          print()
          print("✅ ALL LIVE TESTS PASSED")
          PY

          python /tmp/payton_live_test.py

      - name: Test summary
        if: always()
        run: |
          echo "================================================"
          echo "Payton Live Test finished"
          echo "================================================"
          echo "Railway: $PAYTON_BASE_URL"
          echo "Endpoint: $PAYTON_ENDPOINT"