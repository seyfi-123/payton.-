name: Payton Live Test

on:
  workflow_dispatch:

jobs:
  payton-e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    env:
      PAYTON_BASE_URL: ${{ secrets.PAYTON_BASE_URL }}
      PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}
      PAYTON_SELF_IBAN: ${{ secrets.PAYTON_SELF_IBAN }}
      PAYTON_GUARANTOR_PHONE: ${{ secrets.TEST_USER_PHONE }}
      PAYTON_UNIVERSITY_IBAN: ${{ secrets.PAYTON_UNIVERSITY_IBAN }}
      PAYTON_LANDLORD_IBAN: ${{ secrets.PAYTON_LANDLORD_IBAN }}
      MOCKJET_BASE_URL: ${{ secrets.MOCKJET_BASE_URL }}
      MOCKJET_CIB_KEY: ${{ secrets.MOCKJET_CIB_KEY }}
      MOCKJET_ABS_KEY: ${{ secrets.MOCKJET_ABS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install --upgrade pip requests

      - name: Check required secrets
        run: |
          set -euo pipefail
          missing=0
          check() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::${name} secret is missing"
              missing=1
            else
              echo "${name} length: ${#value}"
            fi
          }
          check PAYTON_BASE_URL "$PAYTON_BASE_URL"
          check PAYTON_API_KEY "$PAYTON_API_KEY"
          check PAYTON_SIGNING_SECRET "$PAYTON_SIGNING_SECRET"
          check PAYTON_SELF_IBAN "$PAYTON_SELF_IBAN"
          check PAYTON_UNIVERSITY_IBAN "$PAYTON_UNIVERSITY_IBAN"
          check PAYTON_LANDLORD_IBAN "$PAYTON_LANDLORD_IBAN"
          check MOCKJET_BASE_URL "$MOCKJET_BASE_URL"
          check MOCKJET_CIB_KEY "$MOCKJET_CIB_KEY"
          check MOCKJET_ABS_KEY "$MOCKJET_ABS_KEY"
          [ "$missing" -eq 0 ]

      - name: Run Payton + MockJet E2E
        shell: bash
        run: |
          cat > live_test.py <<'PY'
          #!/usr/bin/env python3
          """Payton + MockJet live E2E.

          Primary: 4 MockJet + 70 Payton = 74
          Extra:   AUTH01-AUTH03 (do not fail the job)

          DailyPay business rule (live): amount must be 200.00-2000.00 TJS (E1001).
          Self IBAN: ISO 13616, MOD-97 remainder must be 1 (E1006).
          """

          from __future__ import annotations

          import hashlib
          import hmac
          import json
          import os
          import re
          import sys
          import time
          import uuid
          from dataclasses import dataclass
          from typing import Any, Callable

          import requests

          PRIMARY_EXPECTED = 74
          DAILY_MIN = 200
          DAILY_MAX = 2000
          IBAN_RE = re.compile(r"^[A-Z]{2}\d{2}[A-Z0-9]{11,30}$")
          PLACEHOLDER_RE = re.compile(
              r"TESTSELFIBAN|PLACEHOLDER|BADIBAN|YOURIBAN|EXAMPLE|XXXX",
              re.IGNORECASE,
          )

          BASE_URL = os.environ["PAYTON_BASE_URL"].rstrip("/")
          ENDPOINT = f"{BASE_URL}/api/v1/credit/apply"
          API_KEY = os.environ["PAYTON_API_KEY"]
          SIGNING_SECRET = os.environ["PAYTON_SIGNING_SECRET"]

          SELF_IBAN = os.environ["PAYTON_SELF_IBAN"].replace(" ", "").strip().upper()
          UNIVERSITY_IBAN = os.environ.get("PAYTON_UNIVERSITY_IBAN", "").replace(" ", "").strip().upper()
          LANDLORD_IBAN = os.environ.get("PAYTON_LANDLORD_IBAN", "").replace(" ", "").strip().upper()
          GUARANTOR_PHONE = os.environ.get("PAYTON_GUARANTOR_PHONE", "").strip()

          MOCKJET_BASE_URL = os.environ["MOCKJET_BASE_URL"].rstrip("/")
          MOCKJET_CIB_KEY = os.environ.get("MOCKJET_CIB_KEY", "").strip()
          MOCKJET_ABS_KEY = os.environ.get("MOCKJET_ABS_KEY", "").strip()

          session = requests.Session()
          session.headers.update({
              "Accept": "application/json",
              "Content-Type": "application/json",
          })

          passed = 0
          failed = 0
          ran = 0


          def iban_mod97(iban: str) -> int:
              body = iban[4:] + iban[:4]
              digits: list[str] = []
              for ch in body:
                  digits.append(str(ord(ch) - 55) if ch.isalpha() else ch)
              raw = "".join(digits)
              rem = 0
              for i in range(0, len(raw), 9):
                  rem = int(str(rem) + raw[i:i + 9]) % 97
              return rem


          def mask_iban(iban: str) -> str:
              if len(iban) < 8:
                  return "(short)"
              return f"{iban[:4]}...{iban[-4:]} (len={len(iban)})"


          def require_iso_iban(name: str, value: str) -> None:
              if not value:
                  raise SystemExit(f"{name} secret is empty")
              compact = re.sub(r"[^A-Z0-9]", "", value.upper())
              if PLACEHOLDER_RE.search(compact):
                  raise SystemExit(f"{name} is a placeholder — put a real IBAN in GitHub Secrets")
              if not IBAN_RE.fullmatch(value):
                  raise SystemExit(
                      f"{name} is not ISO IBAN format "
                      f"(need CC + 2 check digits + BBAN, 15-34 chars). Got {mask_iban(value)}"
                  )
              rem = iban_mod97(value)
              if rem != 1:
                  raise SystemExit(
                      f"{name} failed ISO 7064 MOD-97 (remainder={rem}, expected 1). "
                      f"Payton returns E1006 for this value. {mask_iban(value)}"
                  )


          def pretty(data: Any) -> str:
              try:
                  return json.dumps(data, ensure_ascii=False, separators=(",", ":"))
              except Exception:
                  return str(data)


          def request_id(product: str) -> str:
              return f"LIVE_{product}_{uuid.uuid4().hex[:12]}"


          def phone(number: int) -> str:
              return f"+99290{number:07d}"


          def face_id(number: int) -> str:
              return f"TEST_FACE_ID_{number:03d}_LIVE"


          def sign(body: str) -> str:
              timestamp = str(int(time.time()))
              body_hash = hashlib.sha256(body.encode("utf-8")).hexdigest()
              canonical = f"POST\n/api/v1/credit/apply\n{timestamp}\n{body_hash}"
              digest = hmac.new(
                  SIGNING_SECRET.encode("utf-8"),
                  canonical.encode("utf-8"),
                  hashlib.sha256,
              ).hexdigest()
              return f"{timestamp}.{digest}"


          def build_payload(
              product: str,
              amount: float,
              number: int,
              *,
              self_iban: str | None = None,
              dob: str | None = None,
              face: str | None = None,
          ) -> dict[str, Any]:
              data: dict[str, Any] = {
                  "request_id": request_id(product),
                  "product_type": product,
                  "amount": amount,
                  "user_phone": phone(number),
                  "passport_series": "AA",
                  "passport_number": f"{10_000_000 + number:08d}",
                  "date_of_birth": dob or "2000-01-15",
                  "face_id_data": face or face_id(number),
                  "self_iban": SELF_IBAN if self_iban is None else self_iban,
              }
              if product == "StudentPay":
                  data["university_iban"] = UNIVERSITY_IBAN
              if product == "RentPay":
                  data["landlord_iban"] = LANDLORD_IBAN
              if GUARANTOR_PHONE:
                  data["guarantor_phone"] = GUARANTOR_PHONE
              return data


          def send_payton(
              data: dict[str, Any],
              *,
              missing_signature: bool = False,
              bad_signature: bool = False,
              bad_api_key: bool = False,
          ) -> tuple[int, Any]:
              body = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "X-API-KEY": "WRONG_API_KEY" if bad_api_key else API_KEY,
              }
              signature = sign(body)
              if bad_signature:
                  ts, digest = signature.split(".", 1)
                  signature = f"{ts}.{('0' if digest[0] != '0' else '1')}{digest[1:]}"
              if not missing_signature:
                  headers["X-Signature"] = signature

              response = session.post(ENDPOINT, data=body.encode("utf-8"), headers=headers, timeout=30)
              try:
                  payload = response.json()
              except Exception:
                  payload = response.text
              return response.status_code, payload


          def has_code(data: Any, code: str) -> bool:
              if not isinstance(data, dict):
                  return False
              detail = data.get("detail")
              if isinstance(detail, dict):
                  return detail.get("code") == code
              if isinstance(detail, list):
                  return any(isinstance(item, dict) and item.get("code") == code for item in detail)
              return data.get("code") == code


          def is_validation_error(data: Any) -> bool:
              if not isinstance(data, dict):
                  return False
              detail = data.get("detail")
              if not isinstance(detail, list):
                  return False
              return any(isinstance(item, dict) and "type" in item for item in detail)


          def is_rejected(data: Any) -> bool:
              if not isinstance(data, dict):
                  return False
              detail = data.get("detail")
              if isinstance(detail, dict) and str(detail.get("status", "")).upper() == "REJECTED":
                  return True
              return str(data.get("status", "")).upper() == "REJECTED"


          def matches(expected: str, status: int, body: Any) -> bool:
              if expected == "SUCCESS":
                  return (
                      status == 200
                      and isinstance(body, dict)
                      and not is_rejected(body)
                      and not has_code(body, "E1001")
                      and not has_code(body, "E1006")
                  )
              if expected == "INVALID_IBAN":
                  return status == 400 and has_code(body, "E1006")
              if expected == "INVALID_AMOUNT":
                  return status == 400 and has_code(body, "E1001")
              if expected == "VALIDATION":
                  return status == 422 and is_validation_error(body)
              if expected == "REJECTED":
                  return status in (400, 422)
              if expected in {"AUTH_MISSING", "AUTH_BAD_SIGNATURE", "AUTH_BAD_KEY"}:
                  return status in (401, 403)
              return False


          @dataclass(frozen=True)
          class PaytonCase:
              label: str
              description: str
              expected: str
              product: str
              amount: float
              number: int
              self_iban: str | None = None
              dob: str | None = None
              face: str | None = None
              tweak: Callable[[dict[str, Any]], None] | None = None


          def drop(field: str) -> Callable[[dict[str, Any]], None]:
              def _tweak(data: dict[str, Any]) -> None:
                  data.pop(field, None)
              return _tweak


          def set_field(field: str, value: Any) -> Callable[[dict[str, Any]], None]:
              def _tweak(data: dict[str, Any]) -> None:
                  data[field] = value
              return _tweak


          STUDENT_AMOUNTS = [
              1000, 1500, 2000, 2500, 3000,
              3500, 4000, 4500, 5000, 5500,
              6000, 6500, 7000, 7500, 8000,
          ]

          RENT_AMOUNTS = list(STUDENT_AMOUNTS)

          DAILY_AMOUNTS = [
              200, 250, 300, 350, 400,
              450, 500, 600, 700, 800,
              900, 1000, 1100, 1200, 1300,
              1400, 1500, 1600, 1800, 2000,
          ]


          def payton_cases() -> list[PaytonCase]:
              cases: list[PaytonCase] = []

              for i, amount in enumerate(STUDENT_AMOUNTS, start=1):
                  cases.append(PaytonCase(
                      label=f"S{i:02d}",
                      description=f"StudentPay valid {amount}",
                      expected="SUCCESS",
                      product="StudentPay",
                      amount=amount,
                      number=100 + i,
                  ))
              cases.extend([
                  PaytonCase("S16", "StudentPay invalid product", "VALIDATION", "StudentPay", 1000, 116,
                             tweak=set_field("product_type", "STUDENT_PAY")),
                  PaytonCase("S17", "StudentPay missing user_phone", "VALIDATION", "StudentPay", 1000, 117,
                             tweak=drop("user_phone")),
                  PaytonCase("S18", "StudentPay empty user_phone", "VALIDATION", "StudentPay", 1000, 118,
                             tweak=set_field("user_phone", "")),
                  PaytonCase("S19", "StudentPay short face_id_data", "VALIDATION", "StudentPay", 1000, 119,
                             face="TEST"),
                  PaytonCase("S20", "StudentPay invalid self IBAN", "INVALID_IBAN", "StudentPay", 1000, 120,
                             self_iban="BAD_IBAN"),
              ])

              for i, amount in enumerate(RENT_AMOUNTS, start=1):
                  cases.append(PaytonCase(
                      label=f"R{i:02d}",
                      description=f"RentPay valid {amount}",
                      expected="SUCCESS",
                      product="RentPay",
                      amount=amount,
                      number=200 + i,
                  ))
              cases.extend([
                  PaytonCase("R16", "RentPay invalid product", "VALIDATION", "RentPay", 1000, 216,
                             tweak=set_field("product_type", "RENT_PAY")),
                  PaytonCase("R17", "RentPay missing landlord_iban", "REJECTED", "RentPay", 1000, 217,
                             tweak=drop("landlord_iban")),
                  PaytonCase("R18", "RentPay empty landlord_iban", "REJECTED", "RentPay", 1000, 218,
                             tweak=set_field("landlord_iban", "")),
                  PaytonCase("R19", "RentPay invalid DOB", "VALIDATION", "RentPay", 1000, 219,
                             dob="wrong"),
                  PaytonCase("R20", "RentPay invalid self IBAN", "INVALID_IBAN", "RentPay", 1000, 220,
                             self_iban="BAD_IBAN"),
              ])

              for amount in DAILY_AMOUNTS:
                  if not DAILY_MIN <= amount <= DAILY_MAX:
                      raise SystemExit(f"DailyPay success amount {amount} outside {DAILY_MIN}-{DAILY_MAX}")

              for i, amount in enumerate(DAILY_AMOUNTS, start=1):
                  cases.append(PaytonCase(
                      label=f"D{i:02d}",
                      description=f"DailyPay valid {amount}",
                      expected="SUCCESS",
                      product="DailyPay",
                      amount=amount,
                      number=300 + i,
                  ))
              cases.extend([
                  PaytonCase("D21", "DailyPay invalid DOB", "VALIDATION", "DailyPay", 1000, 321, dob="wrong"),
                  PaytonCase("D22", "DailyPay short face_id_data", "VALIDATION", "DailyPay", 1000, 322, face="TEST"),
                  PaytonCase("D23", "DailyPay invalid self IBAN 300", "INVALID_IBAN", "DailyPay", 300, 323,
                             self_iban="BAD_IBAN"),
                  PaytonCase("D24", "DailyPay invalid self IBAN 400", "INVALID_IBAN", "DailyPay", 400, 324,
                             self_iban="BAD_IBAN"),
                  PaytonCase("D25", "DailyPay invalid self IBAN 500", "INVALID_IBAN", "DailyPay", 500, 325,
                             self_iban="BAD_IBAN"),
                  PaytonCase("D26", "DailyPay amount below minimum", "INVALID_AMOUNT", "DailyPay", 100, 326),
                  PaytonCase("D27", "DailyPay short user_phone", "VALIDATION", "DailyPay", 1000, 327,
                             tweak=set_field("user_phone", "123")),
                  PaytonCase("D28", "DailyPay amount zero schema", "VALIDATION", "DailyPay", 0, 328),
                  PaytonCase("D29", "DailyPay empty user_phone", "VALIDATION", "DailyPay", 1000, 329,
                             tweak=set_field("user_phone", "")),
                  PaytonCase("D30", "DailyPay extra old phone field", "VALIDATION", "DailyPay", 1000, 330,
                             tweak=set_field("phone", "+992900000001")),
              ])
              return cases


          AUTH_CASES = [
              PaytonCase("AUTH01", "Missing X-Signature", "AUTH_MISSING", "DailyPay", 1000, 901),
              PaytonCase("AUTH02", "Tampered X-Signature", "AUTH_BAD_SIGNATURE", "DailyPay", 1000, 902),
              PaytonCase("AUTH03", "Wrong X-API-KEY", "AUTH_BAD_KEY", "DailyPay", 1000, 903),
          ]


          def run_payton(case: PaytonCase) -> bool:
              global passed, failed, ran
              ran += 1

              data = build_payload(
                  case.product,
                  case.amount,
                  case.number,
                  self_iban=case.self_iban,
                  dob=case.dob,
                  face=case.face,
              )
              if case.tweak:
                  case.tweak(data)

              print()
              print("=" * 72)
              print(f"{ran}/{PRIMARY_EXPECTED} [{case.label}] {case.description}")
              print("=" * 72)
              print(f"Product: {data.get('product_type')}")
              print(f"Amount:  {data.get('amount')}")
              print(f"Request: {data.get('request_id')}")
              print(f"Expect:  {case.expected}")

              try:
                  status, body = send_payton(
                      data,
                      missing_signature=case.expected == "AUTH_MISSING",
                      bad_signature=case.expected == "AUTH_BAD_SIGNATURE",
                      bad_api_key=case.expected == "AUTH_BAD_KEY",
                  )
              except Exception as exc:
                  failed += 1
                  print(f"ERROR: {exc}")
                  print(f"FAIL {case.label} (request error)")
                  return False

              print(f"HTTP: {status}")
              print(f"DATA: {pretty(body)}")

              ok = matches(case.expected, status, body)
              if ok:
                  passed += 1
                  print(f"PASS {case.label}")
              else:
                  failed += 1
                  print(f"FAIL {case.label} (expected={case.expected})")
              return ok


          def run_mockjet(label: str, path: str, key: str, body: dict[str, Any]) -> bool:
              global passed, failed, ran
              ran += 1

              print()
              print("=" * 72)
              print(f"{ran}/{PRIMARY_EXPECTED} [{label}] MockJet POST {path}")
              print("=" * 72)

              if not key:
                  failed += 1
                  print("MockJet key is not configured")
                  print(f"FAIL {label}")
                  return False

              try:
                  response = session.post(
                      MOCKJET_BASE_URL + path,
                      json=body,
                      headers={"Authorization": f"Bearer {key}"},
                      timeout=30,
                  )
                  try:
                      result = response.json()
                  except Exception:
                      result = response.text
              except Exception as exc:
                  failed += 1
                  print(f"ERROR: {exc}")
                  print(f"FAIL {label}")
                  return False

              print(f"HTTP: {response.status_code}")
              print(f"DATA: {pretty(result)}")
              if response.status_code == 200:
                  passed += 1
                  print(f"PASS {label}")
                  return True
              failed += 1
              print(f"FAIL {label}")
              return False


          def main() -> int:
              global passed, failed, ran

              print()
              print("=" * 72)
              print("PAYTON + MOCKJET E2E TEST")
              print("=" * 72)
              print(f"Payton endpoint: {ENDPOINT}")
              print("Primary tests: 4 MockJet + 70 Payton = 74")
              print("Payton: S01-S20 / R01-R20 / D01-D30")
              print(f"SELF_IBAN:       {mask_iban(SELF_IBAN)}")
              print(f"UNIVERSITY_IBAN: {mask_iban(UNIVERSITY_IBAN)}")
              print(f"LANDLORD_IBAN:   {mask_iban(LANDLORD_IBAN)}")
              print("=" * 72)

              require_iso_iban("SELF_IBAN", SELF_IBAN)
              require_iso_iban("UNIVERSITY_IBAN", UNIVERSITY_IBAN)
              require_iso_iban("LANDLORD_IBAN", LANDLORD_IBAN)
              print("IBAN preflight: SELF / UNIVERSITY / LANDLORD passed MOD-97")

              print()
              print("#" * 72)
              print("MOCKJET E2E")
              print("#" * 72)
              run_mockjet("M01", "/api/check", MOCKJET_CIB_KEY, {"passport": "AA10000101"})
              run_mockjet("M02", "/api/score", MOCKJET_CIB_KEY, {"passport": "AA10000101"})
              run_mockjet("M03", "/api/contracts", MOCKJET_ABS_KEY, {
                  "passport": "AA10000101", "amount": 1000, "product": "DAILY_PAY",
              })
              run_mockjet("M04", "/api/contracts", MOCKJET_ABS_KEY, {
                  "passport": "AA10000102", "amount": 2000, "product": "DAILY_PAY",
              })

              for case in payton_cases():
                  run_payton(case)

              primary_pass, primary_fail, primary_ran = passed, failed, ran

              print()
              print("=" * 72)
              print("PRIMARY FINAL RESULT")
              print("=" * 72)
              print(f"TOTAL : {PRIMARY_EXPECTED}")
              print(f"RAN   : {primary_ran}")
              print(f"PASS  : {primary_pass}")
              print(f"FAIL  : {primary_fail}")
              print("=" * 72)

              print()
              print("#" * 72)
              print("AUTHENTICATION TESTS")
              print("#" * 72)
              auth_before = passed + failed
              for case in AUTH_CASES:
                  run_payton(case)
              auth_total = passed + failed - auth_before

              print()
              print("=" * 72)
              print("FINAL RESULT")
              print("=" * 72)
              print(f"PRIMARY TOTAL : {PRIMARY_EXPECTED}")
              print(f"PRIMARY RAN   : {primary_ran}")
              print(f"PRIMARY PASS  : {primary_pass}")
              print(f"PRIMARY FAIL  : {primary_fail}")
              print(f"AUTH TESTS    : {auth_total}")
              print("=" * 72)

              if primary_ran != PRIMARY_EXPECTED:
                  print(f"FAIL expected {PRIMARY_EXPECTED} primary tests, ran {primary_ran}")
                  return 1
              if primary_fail:
                  print(f"FAIL {primary_fail} PRIMARY TEST(S) FAILED")
                  return 1

              print("ALL 74 PRIMARY TESTS PASSED")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          PY
          python live_test.py