name: Payton Production Live Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      PAYTON_BASE_URL: ${{ secrets.PAYTON_BASE_URL }}
      PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}
      PAYTON_ENDPOINT: /api/v1/credit/apply

      MOCKJET_BASE_URL: ${{ secrets.MOCKJET_BASE_URL }}
      MOCKJET_CIB_KEY: ${{ secrets.MOCKJET_CIB_KEY }}
      MOCKJET_FACE_KEY: ${{ secrets.MOCKJET_FACE_KEY }}
      MOCKJET_ABS_KEY: ${{ secrets.MOCKJET_ABS_KEY }}
      MOCKJET_SMS_KEY: ${{ secrets.MOCKJET_SMS_KEY }}

      TEST_USER_PHONE: ${{ secrets.TEST_USER_PHONE }}
      TEST_GUARANTOR_PHONE: ${{ secrets.TEST_GUARANTOR_PHONE }}
      UNKNOWN_GUARANTOR_PHONE: ${{ secrets.UNKNOWN_GUARANTOR_PHONE }}
      TEST_PASSPORT_SERIES: ${{ secrets.TEST_PASSPORT_SERIES }}
      TEST_PASSPORT_NUMBER: ${{ secrets.TEST_PASSPORT_NUMBER }}
      TEST_DOB: ${{ secrets.TEST_DOB }}
      VALID_UNIVERSITY_IBAN: ${{ secrets.VALID_UNIVERSITY_IBAN }}
      VALID_LANDLORD_IBAN: ${{ secrets.VALID_LANDLORD_IBAN }}
      VALID_SELF_IBAN: ${{ secrets.VALID_SELF_IBAN }}
      TEST_FACE_ID_DATA: ${{ secrets.TEST_FACE_ID_DATA }}
      TEST_GUARANTOR_RELATION: ${{ secrets.TEST_GUARANTOR_RELATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check required secrets
        run: |
          set -euo pipefail

          required=(
            PAYTON_BASE_URL
            PAYTON_API_KEY
            PAYTON_SIGNING_SECRET
            MOCKJET_BASE_URL
            MOCKJET_CIB_KEY
            MOCKJET_FACE_KEY
            MOCKJET_ABS_KEY
            MOCKJET_SMS_KEY
            TEST_USER_PHONE
            TEST_GUARANTOR_PHONE
            UNKNOWN_GUARANTOR_PHONE
            TEST_PASSPORT_NUMBER
            VALID_UNIVERSITY_IBAN
            VALID_LANDLORD_IBAN
          )

          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "❌ Missing secret: $name"
              exit 1
            fi
          done

          echo "✅ Required secrets are present"
          echo "PAYTON_BASE_URL=$PAYTON_BASE_URL"
          echo "PAYTON_ENDPOINT=$PAYTON_ENDPOINT"
          echo "MockJet endpoint configured"
          echo "Credentials themselves are not printed."

      - name: Run 74-test live integration suite
        run: |
          cat > payton_74_live_test.py <<'PY'
          import os, json, time, uuid, hmac, hashlib
          from datetime import date, timedelta
          import requests

          BASE_URL = os.environ["PAYTON_BASE_URL"].rstrip("/")
          ENDPOINT = os.environ.get(
              "PAYTON_ENDPOINT",
              "/api/v1/credit/apply"
          )

          API_KEY = os.environ["PAYTON_API_KEY"]
          SIGNING_SECRET = os.environ["PAYTON_SIGNING_SECRET"]

          MOCK_URL = os.environ.get(
              "MOCKJET_BASE_URL",
              "https://mockjet.io/m/5b1fe03c-9ffd-43e6-848c-7fd3a1b711a9"
          ).rstrip("/")

          MOCK_KEYS = {
              "cib": os.environ["MOCKJET_CIB_KEY"],
              "face": os.environ["MOCKJET_FACE_KEY"],
              "abs": os.environ["MOCKJET_ABS_KEY"],
              "sms": os.environ["MOCKJET_SMS_KEY"],
          }

          FIX = {
              "user_phone": os.environ["TEST_USER_PHONE"],
              "guarantor_phone": os.environ["TEST_GUARANTOR_PHONE"],
              "unknown_guarantor": os.environ[
                  "UNKNOWN_GUARANTOR_PHONE"
              ],
              "passport_series": os.environ.get(
                  "TEST_PASSPORT_SERIES",
                  "A"
              ),
              "passport_number": os.environ[
                  "TEST_PASSPORT_NUMBER"
              ],
              "dob": os.environ.get(
                  "TEST_DOB",
                  "2000-01-01"
              ),
              "university_iban": os.environ[
                  "VALID_UNIVERSITY_IBAN"
              ],
              "landlord_iban": os.environ[
                  "VALID_LANDLORD_IBAN"
              ],
              "self_iban": os.environ.get(
                  "VALID_SELF_IBAN",
                  ""
              ),
              "face": os.environ.get(
                  "TEST_FACE_ID_DATA",
                  "TEST_FACE_ID_001"
              ),
              "relation": os.environ.get(
                  "TEST_GUARANTOR_RELATION",
                  "FATHER"
              ),
          }

          TIMEOUT = float(
              os.environ.get(
                  "PAYTON_TEST_TIMEOUT",
                  "30"
              )
          )

          BAD_IBAN = "TJ00BAD"

          ENV_CODES = {
              "E1013",
              "E1015",
              "E2001",
              "E2002",
              "E2006",
          }

          SUCCESS_CODES = {
              "E0001",
              "E0003",
              "E0000",
          }

          def sig(body: bytes):
              ts = str(int(time.time()))

              bh = hashlib.sha256(body).hexdigest()

              canonical = (
                  f"POST\n"
                  f"{ENDPOINT}\n"
                  f"{ts}\n"
                  f"{bh}"
              )

              digest = hmac.new(
                  SIGNING_SECRET.encode(),
                  canonical.encode(),
                  hashlib.sha256
              ).hexdigest()

              return f"{ts}.{digest}"

          def code_of(data):
              if not isinstance(data, dict):
                  return None

              if isinstance(data.get("code"), str):
                  return data["code"]

              detail = data.get("detail")

              if (
                  isinstance(detail, dict)
                  and isinstance(detail.get("code"), str)
              ):
                  return detail["code"]

              return None

          def safe(data):
              if not isinstance(data, dict):
                  return data

              x = dict(data)

              hidden = (
                  "passport_number",
                  "user_phone",
                  "guarantor_phone",
                  "university_iban",
                  "landlord_iban",
                  "self_iban",
                  "face_id_data",
              )

              for key in hidden:
                  if key in x and x[key] is not None:
                      x[key] = "***"

              return x

          def base(product, amount, **kw):
              payload = {
                  "request_id":
                      "GH74_" + uuid.uuid4().hex[:20],

                  "product_type":
                      product,

                  "amount":
                      amount,

                  "user_phone":
                      FIX["user_phone"],

                  "passport_series":
                      FIX["passport_series"],

                  "passport_number":
                      FIX["passport_number"],

                  "date_of_birth":
                      FIX["dob"],

                  "face_id_data":
                      FIX["face"],
              }

              if product == "StudentPay":
                  payload["university_iban"] = (
                      FIX["university_iban"]
                  )

                  payload["university_name"] = (
                      "Test University"
                  )

              if product == "RentPay":
                  payload["landlord_iban"] = (
                      FIX["landlord_iban"]
                  )

                  payload["landlord_name"] = (
                      "Test Landlord"
                  )

              if FIX["self_iban"]:
                  payload["self_iban"] = (
                      FIX["self_iban"]
                  )

              if kw.pop(
                  "with_guarantor",
                  True
              ):
                  payload["guarantor_phone"] = (
                      FIX["guarantor_phone"]
                  )

                  payload["guarantor_relation"] = (
                      FIX["relation"]
                  )

              payload.update(kw)

              return payload

          def request(
              session,
              payload,
              api_key=API_KEY,
              secret=SIGNING_SECRET
          ):
              body = json.dumps(
                  payload,
                  ensure_ascii=False,
                  separators=(",", ":")
              ).encode()

              headers = {
                  "Content-Type":
                      "application/json",

                  "Accept":
                      "application/json",

                  "X-API-KEY":
                      api_key,

                  "X-Signature":
                      sig(body) if secret else "",
              }

              if not secret:
                  headers.pop(
                      "X-Signature",
                      None
                  )

              try:
                  response = session.post(
                      BASE_URL + ENDPOINT,
                      content=body,
                      headers=headers,
                      timeout=TIMEOUT,
                  )

                  try:
                      data = response.json()
                  except Exception:
                      data = {
                          "raw":
                              response.text[:4000]
                      }

                  return (
                      response.status_code,
                      code_of(data),
                      data
                  )

              except Exception as exc:
                  return (
                      None,
                      None,
                      {
                          "error":
                              f"{type(exc).__name__}: {exc}"
                      }
                  )

          def mock(
              session,
              path,
              payload,
              key
          ):
              try:
                  response = session.post(
                      MOCK_URL + path,
                      json=payload,
                      headers={
                          "Authorization":
                              "Bearer " + key,

                          "Content-Type":
                              "application/json",
                      },
                      timeout=TIMEOUT,
                  )

                  try:
                      data = response.json()
                  except Exception:
                      data = {
                          "raw":
                              response.text[:2000]
                      }

                  return (
                      response.status_code,
                      data
                  )

