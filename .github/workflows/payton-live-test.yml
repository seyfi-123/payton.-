          def evaluate(
              status,
              code,
              expected_http,
              expected_code,
              mode
          ):
              if status is None:
                  return "FAIL"

              if mode == "success":
                  if (
                      status == 200
                      and code in SUCCESS_CODES
                  ):
                      return "PASS"

                  if code in ENV_CODES:
                      return "DATA_BLOCKED"

                  return "FAIL"

              if mode == "post_external":
                  if (
                      status == expected_http
                      and code == expected_code
                  ):
                      return "PASS"

                  if code in ENV_CODES:
                      return "DATA_BLOCKED"

                  return "FAIL"

              if (
                  status == expected_http
                  and (
                      expected_code is None
                      or code == expected_code
                  )
              ):
                  return "PASS"

              return "FAIL"

          def run_application_tests(session):
              results = []

              for n, (
                  test_id,
                  name,
                  factory,
                  expected_http,
                  expected_code,
                  mode
              ) in enumerate(T, 1):

                  payload = factory()

                  status, code, data = request(
                      session,
                      payload
                  )

                  if mode == "duplicate_first":
                      if (
                          status == 200
                          and code in SUCCESS_CODES
                      ):
                          result = "PASS"

                      elif code in ENV_CODES:
                          result = "DATA_BLOCKED"

                      else:
                          result = "FAIL"

                  elif mode == "duplicate_second":
                      if (
                          status == 409
                          and code == "E0002"
                      ):
                          result = "PASS"

                      elif code in ENV_CODES:
                          result = "DATA_BLOCKED"

                      else:
                          result = "FAIL"

                  else:
                      result = evaluate(
                          status,
                          code,
                          expected_http,
                          expected_code,
                          mode
                      )

                  print(
                      f"[{n:02d}/70] "
                      f"{result:<12} "
                      f"{test_id} "
                      f"HTTP={status} "
                      f"CODE={code or '-'} "
                      f"{name}"
                  )

                  results.append({
                      "id": test_id,
                      "name": name,
                      "result": result,
                      "expected_http":
                          expected_http,
                      "expected_code":
                          expected_code,
                      "mode": mode,
                      "actual_http": status,
                      "actual_code": code,
                      "response": safe(data),
                      "payload": safe(payload),
                  })

              return results

