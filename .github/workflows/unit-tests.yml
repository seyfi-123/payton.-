name: Unit Tests (92 tests)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run Unit Tests
        run: |
          python -m pytest tests/unit/test_all.py -v --tb=short

      - name: Summary
        if: always()
        run: |
          echo "✅ Unit Tests Completed"
          echo "Crypto: 25 tests"
          echo "Business Logic: 29 tests"
          echo "Config/API: 38 tests"
          echo "Total: 92 tests"