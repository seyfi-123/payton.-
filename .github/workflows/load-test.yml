name: Load Test

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PAYTON_BASE_URL: ${{ secrets.PAYTON_BASE_URL }}
      PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install locust requests

      - name: Run load test
        env:
          PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
          PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}
        run: |
          locust -f load_test.py \
            --host=${{ secrets.PAYTON_BASE_URL }} \
            --users=100 \
            --spawn-rate=20 \
            --run-time=60s \
            --headless \
            --csv=load_results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load_results*.csv