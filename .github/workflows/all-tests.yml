name: All Tests (Unit, Security, E2E, Load)

on:
  workflow_dispatch: # Барои иҷрои дастӣ
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # 1. UNIT TESTS (92 тест)
  # ==========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 3_requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Unit Tests
        run: |
          python -m pytest tests/unit/ -v --cov=credit_engine --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage.xml

  # ==========================================
  # 2. SECURITY TESTS (Bandit + Pip-audit)
  # ==========================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install bandit pip-audit
          pip install -r 3_requirements.txt

      - name: Run Bandit (Code Security)
        run: bandit -r . -ll
        continue-on-error: true

      - name: Run Pip-audit (Dependency Security)
        run: pip-audit -r 3_requirements.txt
        continue-on-error: true

  # ==========================================
  # 3. INTEGRATION TESTS (10 тест)
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: bank_db_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r 3_requirements.txt
          pip install pytest pytest-asyncio asyncpg

      - name: Run Integration Tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: bank_db_test
          DB_USER: test_user
          DB_PASSWORD: test_password
        run: python -m pytest tests/integration/ -v

  # ==========================================
  # 4. E2E TESTS (74 + 3 Auth тест)
  # ==========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    env:
      PAYTON_BASE_URL: ${{ secrets.PAYTON_BASE_URL }}
      PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}
      PAYTON_SELF_IBAN: ${{ secrets.PAYTON_SELF_IBAN }}
      PAYTON_UNIVERSITY_IBAN: ${{ secrets.PAYTON_UNIVERSITY_IBAN }}
      PAYTON_LANDLORD_IBAN: ${{ secrets.PAYTON_LANDLORD_IBAN }}
      MOCKJET_BASE_URL: ${{ secrets.MOCKJET_BASE_URL }}
      MOCKJET_CIB_KEY: ${{ secrets.MOCKJET_CIB_KEY }}
      MOCKJET_ABS_KEY: ${{ secrets.MOCKJET_ABS_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run E2E Tests
        run: python live_test.py

  # ==========================================
  # 5. LOAD TESTS (239 RPS)
  # ==========================================
  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch'

    env:
      PAYTON_BASE_URL: ${{ secrets.PAYTON_BASE_URL }}
      PAYTON_API_KEY: ${{ secrets.PAYTON_API_KEY }}
      PAYTON_SIGNING_SECRET: ${{ secrets.PAYTON_SIGNING_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install locust requests

      - name: Run Load Test
        run: |
          locust -f load_test.py \
            --host=${{ secrets.PAYTON_BASE_URL }} \
            --users=100 \
            --spawn-rate=20 \
            --run-time=60s \
            --headless \
            --csv=load_results

      - name: Upload Load Test Results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load_results*.csv