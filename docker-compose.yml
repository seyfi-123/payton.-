services:
  postgres:
    image: postgres:15-alpine
    container_name: credit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-bank_db}
      POSTGRES_USER: ${DB_USER:-bank_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./1schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bank_user} -d ${DB_NAME:-bank_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - credit_net
    mem_limit: 1g
    cpus: 1.0

  credit_engine:
    build:
      context: .
      dockerfile: 4_Dockerfile
    container_name: credit_engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-bank_db}
      DB_USER: ${DB_USER:-bank_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      API_KEY: ${API_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      API_PORT: 8000
      ENV: ${ENV:-production}
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      LEADER_ELECTION_ENABLED: ${LEADER_ELECTION_ENABLED:-true}
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      VAULT_URL: ${VAULT_URL:-}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      VAULT_PATH: ${VAULT_PATH:-credit-engine/keys}
      MASTER_KEY_HEX: ${MASTER_KEY_HEX}
      HMAC_KEY_HEX: ${HMAC_KEY_HEX}
      CARD_SIGNATURE_KEY_HEX: ${CARD_SIGNATURE_KEY_HEX}
      CIB_URL: ${CIB_URL}
      CIB_API_KEY: ${CIB_API_KEY}
      FACE_ID_URL: ${FACE_ID_URL}
      FACE_ID_API_KEY: ${FACE_ID_API_KEY}
      ABS_URL: ${ABS_URL}
      ABS_API_KEY: ${ABS_API_KEY}
      PAYMENT_URL: ${PAYMENT_URL}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
      SMS_URL: ${SMS_URL}
      SMS_API_KEY: ${SMS_API_KEY}
      INTERNAL_CLIENT_CERT: /app/certs/client.crt
      INTERNAL_CLIENT_KEY: /app/certs/client.key
      INTERNAL_CA_CERT: /app/certs/ca.crt
    volumes:
      - ./certs:/app/certs:ro
      - ./logs:/app/logs
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - credit_net
    mem_limit: 2g
    cpus: 2.0

volumes:
  postgres_data:
    driver: local

networks:
  credit_net:
    driver: bridge